<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loyiha Generatori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* a light dev-terminal look - one committed world, no dark variant */
    --bg:#f6f5f0;
    --bg-dot:#d8d5c8;
    --card-bg:#fffdf8;
    --bar-bg:#ece7d8;
    --border:#cfc9b8;
    --ink:#2a2a22;
    --ink-soft:#7a7360;
    --accent:#4d8a5a;
    --query:#3a7ca8;
    --query-bg:#e7f0f5;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    padding-block:32px;
    padding-inline:16px;
    background-color: var(--bg);
    background-image: radial-gradient(var(--bg-dot) 1px, transparent 1px);
    background-size: 16px 16px;
    color: var(--ink);
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  /* ---- cards scattered across the whole page ---- */
  .global-field{ position:fixed; inset:0; pointer-events:none; z-index:50; }

  .box{
    position:relative;
    z-index:1;
    max-width: 680px;
    margin: 0 auto;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    overflow:hidden;
    box-shadow: 0 14px 34px rgba(42,42,34,.10);
  }
  .box-bar{
    display:flex;
    align-items:center;
    gap:7px;
    padding:11px 14px;
    background: var(--bar-bg);
    border-bottom: 1.5px solid var(--border);
  }
  .box-bar .dot{ width:10px; height:10px; border-radius:50%; flex:none; }
  .box-bar .dot-r{ background:#e5675a; }
  .box-bar .dot-y{ background:#e3b341; }
  .box-bar .dot-g{ background:#5fae6b; }
  .box-bar .bar-title{ margin-left:8px; font-size:12px; color: var(--ink-soft); }
  .box-body{ padding:24px 22px; }

  @keyframes scrollLeft{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  @keyframes scrollRight{ from{ transform:translateX(-50%); } to{ transform:translateX(0); } }

  /* ---- top info: picked summary (empty until a card is opened) ---- */
  .subtitle{
    color: var(--ink-soft);
    font-size: 13px;
    line-height: 1.65;
    font-style:italic;
    margin: 0 0 20px;
  }
  .subtitle .picked-row{
    display:block;
    font-style:normal;
    color: var(--ink);
    margin-bottom:8px;
  }
  .subtitle .picked-row b{ font-weight:700; }
  .subtitle .picked-desc{ display:block; color: var(--ink-soft); }

  /* ---- result area ---- */
  .stage{ position:relative; min-height: 0; }

  /* ---- cards: 4 rows scrolling across the whole page ---- */
  .card-row{
    position:fixed;
    left:0;
    width:max-content;
    display:flex;
    gap:22px;
    animation: scrollLeft 32s linear infinite;
  }
  .card-row.dir-right{ animation-name: scrollRight; }
  .card-row.dir-left{ animation-name: scrollLeft; }
  .face-card{
    position:static;
    flex:none;
    width:70px; height:98px;
    border-radius:8px;
    background: var(--card-bg);
    border:1.5px solid var(--border);
    box-shadow: 0 8px 18px rgba(42,42,34,.10);
    display:flex; align-items:center; justify-content:center;
    font-family:"JetBrains Mono", monospace;
    font-weight:600;
    font-size:15px;
    color: var(--ink-soft);
    cursor:pointer;
    user-select:none;
    pointer-events:auto;
  }

  /* ---- drawn card: a terminal-window result ---- */
  .term-card{
    max-width:280px;
    margin:0 auto;
    border:1.5px solid var(--border);
    border-radius:8px;
    overflow:hidden;
    background: var(--card-bg);
    box-shadow: 0 16px 36px rgba(42,42,34,.12);
    opacity:0;
    transform: translateY(8px) scale(.98);
    animation: cardIn .28s ease forwards;
  }
  @keyframes cardIn{ to{ opacity:1; transform:none; } }
  .term-bar{
    background: var(--bar-bg);
    border-bottom:1.5px solid var(--border);
    padding:8px 14px;
    font-size:12px;
    color: var(--ink-soft);
  }
  .term-body{ padding:18px 16px 20px; text-align:left; }
  .term-comment{ font-size:11.5px; color: var(--accent); margin-bottom:8px; }
  .term-name{
    font-family:"JetBrains Mono", monospace;
    font-weight:700;
    font-size:17px;
    color: var(--ink);
    margin:0 0 12px;
    line-height:1.3;
  }
  .term-row{ font-size:12px; color: var(--ink-soft); margin-bottom:16px; }
  .term-row b{ color: var(--ink); }

  /* ---- below-card: keys + draw again ---- */
  .below-card{ margin-top:20px; }

  .tags{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px; }
  .tag{
    font-family:"JetBrains Mono", monospace;
    font-size:11.5px;
    color: var(--ink);
    background: var(--bg);
    border:1px solid var(--border);
    padding:4px 9px;
    border-radius:5px;
  }

  .keys{ display:flex; flex-direction:column; gap:8px; }
  .key-toggle{
    align-self:flex-start;
    font-family:"JetBrains Mono", monospace;
    font-weight:600;
    font-size:12px;
    color: var(--query);
    background: var(--query-bg);
    border:1.5px solid var(--query);
    border-radius:6px;
    padding:8px 14px;
    cursor:pointer;
  }
  .key-toggle.open{ background: var(--query); color: var(--card-bg); }
  .key-content{ margin: 8px 0 4px; }
  .key-content[hidden]{ display:none; }
  .query-console{
    display:flex; gap:10px; align-items:flex-start;
    background:#faf8f0;
    border:1px solid var(--border);
    border-radius:6px;
    padding:12px;
  }
  .query-text{
    flex:1; margin:0;
    font-family:"JetBrains Mono", monospace;
    font-size:12.5px;
    line-height:1.6;
    color: var(--ink);
  }
  .copy-btn{
    flex:none;
    font-family:"JetBrains Mono", monospace;
    font-weight:700;
    font-size:11px;
    color: var(--card-bg);
    background: var(--ink);
    border:none;
    border-radius:5px;
    padding:8px 12px;
    cursor:pointer;
    transition: transform .08s ease;
  }
  .copy-btn:active{ transform: translateY(2px); }
  .copy-btn.copied{ background: var(--accent); }
  .copy-btn:focus-visible{ outline:2px solid var(--query); outline-offset:2px; }
  @media (max-width:480px){
    .query-console{ flex-direction:column; }
    .copy-btn{ align-self:flex-end; }
  }

  .again-btn{
    display:table;
    margin:24px auto 0;
    font-family:"JetBrains Mono", monospace;
    font-weight:700;
    font-size:13px;
    color: var(--card-bg);
    background: var(--ink);
    border:none;
    border-radius:6px;
    padding:12px 22px;
    cursor:pointer;
    transition: transform .08s ease;
  }
  .again-btn:active{ transform: translateY(2px); }
  .again-btn:focus-visible{ outline:2px solid var(--query); outline-offset:3px; }

  .cooldown-line{
    display:table;
    margin:24px auto 0;
    font-family:"JetBrains Mono", monospace;
    font-size:12.5px;
    font-style:italic;
    color: var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce){
    .term-card{ animation:none; opacity:1; transform:none; }
    .card-row{ animation:none; }
  }
</style>
</head>
<body>
<div class="global-field" id="globalField"></div>
<div class="box">
  <div class="box-bar">
    <span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span>
    <span class="bar-title">loyiha-kartalari.sh</span>
  </div>
  <div class="box-body">
    <p class="subtitle" id="topInfo"></p>

    <div class="below-card" id="belowCard"></div>

</div>

  {name:"Yosh ota-onalar uchun tungi navbat bilan bola parvarishi tarmog'i", difficulty:"Oson", desc:"Bir mahallada yashovchi yangi ota-onalarni tungi parvarish tajribasi va yordamini almashish uchun bog'laydigan tarmoq.", tags:["Community","Parenting"]},
  {name:"Chekka hududlarga dori yetkazib berish marshrutlarini optimallashtiruvchi tizim", difficulty:"Qiyin", desc:"Yo'l infratuzilmasi yomon hududlarga dori-darmon yetkazib berish marshrutlarini eng qisqa va ishonchli qilib rejalashtiruvchi tizim.", tags:["Logistics","HealthTech","Routing"]},
  {name:"Talabalar uchun imtihon oldidan bilim bo'shliqlarini aniqlovchi diagnostik test tizimi", difficulty:"O'rta", desc:"Imtihondan oldin talabaning qaysi mavzularda kuchsiz ekanini aniqlab, faqat o'sha qismlarga yo'naltiruvchi qisqa diagnostik testlar.", tags:["EdTech","Assessment","AI"]},
  {name:"Mahalliy transport uchun real vaqtdagi bandlik ko'rsatkichi", difficulty:"Qiyin", desc:"Avtobus ichidagi bandlik darajasini sensorlar orqali aniqlab, navbatdagi bekatlarga oldindan xabar beruvchi tizim.", tags:["IoT","Public Transport","Realtime"]},
];

const COOLDOWN_HOURS = { "Oson": 1.5, "O'rta": 2, "Qiyin": 3 };
const LOCK_KEY = "loyiha-generator:lock";
let countdownTimer = null;

const stage = document.getElementById("stage");
const topInfoEl = document.getElementById("topInfo");
const belowCardEl = document.getElementById("belowCard");
const globalField = document.getElementById("globalField");
const DEFAULT_TOPINFO = "// Sahifada aylanib yurgan kartalardan birini bosing";
topInfoEl.textContent = DEFAULT_TOPINFO;

function loadLockRaw(){
  try{
    const raw = localStorage.getItem(LOCK_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(!data || typeof data.unlockAt !== "number" || !data.pick) return null;
    if(data.unlockAt <= Date.now()){
      localStorage.removeItem(LOCK_KEY);
      return null;
    }
    return data;
  }catch(e){
    return null;
  }
}

function saveLockRaw(pick, unlockAt){
  try{
    localStorage.setItem(LOCK_KEY, JSON.stringify({ pick, unlockAt }));
  }catch(e){
    /* storage unavailable — break time just won't survive a reload */
  }
}

function clearLockRaw(){
  try{ localStorage.removeItem(LOCK_KEY); }catch(e){}
}

function formatCountdown(ms){
  const totalSec = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = n => String(n).padStart(2, "0");
  return pad(h) + ":" + pad(m) + ":" + pad(s);
}

function showCooldown(unlockAt){
  const area = document.getElementById("againArea");
  if(!area) return;
  area.innerHTML = `<div class="cooldown-line" id="cooldownLine">// keyingi karta: 00:00:00</div>`;
  if(countdownTimer) clearInterval(countdownTimer);
  const tick = () => {
    const remaining = unlockAt - Date.now();
    if(remaining <= 0){
      clearInterval(countdownTimer);
      countdownTimer = null;
      clearLockRaw();
      topInfoEl.textContent = DEFAULT_TOPINFO;
      belowCardEl.innerHTML = "";
      renderIdleField();
      return;
    }
    const el = document.getElementById("cooldownLine");
    if(el) el.textContent = "// keyingi karta: " + formatCountdown(remaining);
  };
  tick();
  countdownTimer = setInterval(tick, 1000);
}

function aiQueryFor(p){
  return `Men "${p.name}" nomli loyiha g'oyasini amalga oshirmoqchiman: ${p.desc} Buning uchun MVP qanday funksiyalardan iborat bo'lishi kerak, qaysi texnologik stekni tanlash maqsadga muvofiq va bosqichma-bosqich boshlash rejasini tuzib ber.`;
}

function googleQueryFor(p){
  return `${p.name} - mavjud yechimlar va raqobatchilar tahlili`;
}

/* ---- idle state: 4 rows of face-down cards scrolling across the page ---- */
const ROW_CONFIG = [
  { dir: "right", top: 24, dur: 24 },
  { dir: "left", top: 42, dur: 21 },
  { dir: "right", top: 60, dur: 27 },
  { dir: "left", top: 78, dur: 22 },
];
const CARD_PITCH = 92; // 70px card + 22px gap

function renderIdleField(){
  stage.innerHTML = "";
  belowCardEl.innerHTML = "";

  const setCount = Math.max(10, Math.ceil((window.innerWidth + CARD_PITCH * 3) / CARD_PITCH));

  globalField.innerHTML = ROW_CONFIG.map(row => {
    const cards = Array.from({ length: setCount }, () => `<div class="face-card">&gt;_</div>`).join("");
    return `<div class="card-row dir-${row.dir}" style="top:${row.top}%;animation-duration:${row.dur}s">${cards}${cards}</div>`;
  }).join("");

  globalField.querySelectorAll(".face-card").forEach(el => {
    el.addEventListener("click", () => {
      const pick = PROJECTS[Math.floor(Math.random() * PROJECTS.length)];
      pickFromField(pick, el);
    }, { once: true });
  });
}

function pickFromField(pick, clickedEl){
  globalField.querySelectorAll(".card-row").forEach(row => {
    row.style.animationPlayState = "paused";
  });
  globalField.querySelectorAll(".face-card").forEach(el => {
    if(el !== clickedEl){
      el.style.transition = "opacity .3s ease";
      el.style.opacity = "0";
      el.style.pointerEvents = "none";
    }
  });
  clickedEl.style.pointerEvents = "none";
  clickedEl.style.transition = "opacity .25s ease, transform .25s ease";
  clickedEl.style.opacity = "0";
  clickedEl.style.transform = "scale(.7)";
  setTimeout(() => {
    globalField.innerHTML = "";
    landOnCard(pick);
  }, 220);
}

/* ---- picked state: terminal-window result ---- */
function renderPicked(pick){
  topInfoEl.innerHTML =
    `<span class="picked-row">daraja: <b>${pick.difficulty}</b></span>` +
    `<span class="picked-desc">// ${pick.desc}</span>`;

  stage.innerHTML = `
    <div class="term-card">
      <div class="term-bar">$ karta --draw</div>
      <div class="term-body">
        <div class="term-comment">// natija</div>
        <h2 class="term-name">${pick.name}</h2>
        <div class="term-row">daraja: <b>${pick.difficulty}</b></div>
      </div>
    </div>
  `;

  const aiQuery = aiQueryFor(pick);
  const googleQuery = googleQueryFor(pick);

  belowCardEl.innerHTML = `
    <div class="tags">${pick.tags.map(t => `<span class="tag">#${t}</span>`).join("")}</div>
    <div class="keys">
      <button class="key-toggle" type="button" data-target="keyAi">$ ai --ask</button>
      <div class="key-content" id="keyAi" hidden>
        <div class="query-console">
          <p class="query-text">${aiQuery}</p>
          <button class="copy-btn" type="button">copy</button>
        </div>
      </div>
      <button class="key-toggle" type="button" data-target="keyGoogle">$ google --search</button>
      <div class="key-content" id="keyGoogle" hidden>
        <div class="query-console">
          <p class="query-text">${googleQuery}</p>
          <button class="copy-btn" type="button">copy</button>
        </div>
      </div>
    </div>
    <div id="againArea"></div>
  `;
}

function landOnCard(pick){
  renderPicked(pick);
  const hours = COOLDOWN_HOURS[pick.difficulty] || 1.5;
  const unlockAt = Date.now() + hours * 60 * 60 * 1000;
  saveLockRaw(pick, unlockAt);
  showCooldown(unlockAt);
}

function copyText(text, btn){
  const original = btn.textContent;
  const finish = (ok) => {
    btn.textContent = ok ? "copied!" : "error";
    btn.classList.toggle("copied", ok);
    setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove("copied");
    }, 1600);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => finish(true)).catch(() => fallbackCopy(text, finish));
  } else {
    fallbackCopy(text, finish);
  }
}

function fallbackCopy(text, finish){
  try{
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    finish(ok);
  }catch(err){
    finish(false);
  }
}

document.addEventListener("click", (e) => {
  const toggle = e.target.closest(".key-toggle");
  if(toggle){
    const content = document.getElementById(toggle.dataset.target);
    if(content){
      const isHidden = content.hasAttribute("hidden");
      if(isHidden){ content.removeAttribute("hidden"); toggle.classList.add("open"); }
      else { content.setAttribute("hidden", ""); toggle.classList.remove("open"); }
    }
    return;
  }
  const copyBtn = e.target.closest(".copy-btn");
  if(copyBtn){
    const row = copyBtn.closest(".query-console");
    const textEl = row && row.querySelector(".query-text");
    if(textEl) copyText(textEl.textContent, copyBtn);
  }
});

const existingLock = loadLockRaw();
if(existingLock){
  renderPicked(existingLock.pick);
  showCooldown(existingLock.unlockAt);
} else {
  renderIdleField();
}
</script>
</body>
</html>
