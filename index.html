<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loyiha Generatori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* deliberately single-theme: a lit collector's display case has no "day mode" */
    --paper:#0b2318;
    --paper-2:#123527;
    --card-bg:#0f2c1f;
    --ink:#f4ecd8;
    --ink-soft:#b3c2ac;
    --ruby:#c14a63;
    --sapphire:#3f8fd6;
    --gold:#d9ae42;
    --exist:#4fd19c;
    --exist-bg:rgba(79,209,156,.14);
    --idea:#b98cf0;
    --idea-bg:rgba(185,140,240,.14);
    --query:#6fb0f2;
    --query-bg:rgba(111,176,242,.12);
    --gold-1:#f6e0a0; --gold-2:#caa23a; --gold-3:#8a6a1c;
    --card-white:#fdfaf3;
    --card-red:#b3212f;
    --card-black:#1c1a17;
    --cardback-red:#a4202c;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    padding-block:32px;
    padding-inline:16px;
    background-color: var(--paper);
    background-image:
      radial-gradient(900px circle at 50% 0%, rgba(217,174,66,.08), transparent 60%),
      radial-gradient(700px circle at 10% 90%, rgba(79,209,156,.06), transparent 60%),
      radial-gradient(700px circle at 90% 90%, rgba(185,140,240,.06), transparent 60%);
    color: var(--ink);
    font-family: "Karla", ui-sans-serif, system-ui, sans-serif;
  }

  /* ---- cards scattered across the whole page ---- */
  .global-field{ position:fixed; inset:0; pointer-events:none; z-index:50; }

  .box{
    position:relative;
    z-index:1;
    max-width: 680px;
    margin: 0 auto;
    background: linear-gradient(165deg, var(--paper-2), var(--paper));
    border: 2px solid rgba(217,174,66,.35);
    border-radius: 22px;
    padding: 26px;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
  }

  .box-header{
    text-align:center;
    padding-bottom:16px;
    margin-bottom:18px;
    border-bottom: 1px solid rgba(217,174,66,.25);
  }
  .title{
    font-family:"Cinzel", serif;
    font-weight:700;
    font-size: clamp(24px, 5.5vw, 34px);
    letter-spacing:.02em;
    background: linear-gradient(180deg, var(--gold-1), var(--gold-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin:0;
    text-wrap:balance;
  }

  @keyframes scrollLeft{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  @keyframes scrollRight{ from{ transform:translateX(-50%); } to{ transform:translateX(0); } }

  /* ---- top info: picked summary (empty until a card is opened) ---- */
  .subtitle{
    color: var(--ink-soft);
    font-size: 14.5px;
    line-height: 1.65;
    max-width: 56ch;
    margin: 0 0 20px;
  }
  .subtitle .picked-banner{
    display:block;
    font-family:"Cinzel", serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:.05em;
    margin-bottom:8px;
  }
  .subtitle .picked-desc{ display:block; color: var(--ink-soft); font-size:14.5px; line-height:1.65; }

  /* ---- result area ---- */
  .stage{ position:relative; min-height: 0; }

  /* ---- cards: 4 rows scrolling across the whole page ---- */
  .card-row{
    position:fixed;
    left:0;
    width:max-content;
    display:flex;
    gap:22px;
    animation: scrollLeft 32s linear infinite;
  }
  .card-row.dir-right{ animation-name: scrollRight; }
  .card-row.dir-left{ animation-name: scrollLeft; }
  .face-card{
    position:static;
    flex:none;
    width:70px; height:98px;
    border-radius:8px;
    border:4px solid var(--card-white);
    outline:1.5px solid rgba(0,0,0,.45);
    background-color: var(--cardback-red);
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,.14) 0 2px, transparent 2px 7px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.14) 0 2px, transparent 2px 7px);
    box-shadow: 0 10px 22px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center;
    color: var(--card-white);
    cursor:pointer;
    user-select:none;
    pointer-events:auto;
  }
  .face-card svg{ opacity:.85; }

  /* ---- drawn card: a real playing-card face ---- */
  .playing-card{
    position:relative;
    width:236px;
    max-width:100%;
    aspect-ratio: 5 / 7;
    margin:0 auto;
    background: var(--card-white);
    border:2.5px solid var(--card-black);
    border-radius:14px;
    box-shadow: 0 18px 40px rgba(0,0,0,.55);
    opacity:0;
    transform: translateY(10px) scale(.97);
    animation: cardIn .32s ease forwards;
  }
  @keyframes cardIn{ to{ opacity:1; transform:none; } }
  .playing-card::before{
    content:"";
    position:absolute; inset:9px;
    border:1px solid rgba(28,26,23,.22);
    border-radius:8px;
    pointer-events:none;
  }
  .pc-corner{
    position:absolute;
    display:flex; flex-direction:column; align-items:center;
    gap:2px;
    line-height:1;
    font-family:"Cinzel", serif;
  }
  .pc-corner.pc-top{ top:14px; left:14px; }
  .pc-corner.pc-bottom{ bottom:14px; right:14px; transform:rotate(180deg); }
  .pc-rank{ font-size:19px; font-weight:700; }
  .playing-card[data-suit="red"] .pc-corner,
  .playing-card[data-suit="red"] .pc-watermark{ color: var(--card-red); }
  .playing-card[data-suit="black"] .pc-corner,
  .playing-card[data-suit="black"] .pc-watermark{ color: var(--card-black); }
  .pc-center{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding: 44px 20px;
  }
  .pc-watermark{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    opacity:.08;
    line-height:1;
  }
  .pc-name{
    position:relative;
    font-family:"Cinzel", serif;
    font-weight:700;
    font-size:18px;
    color: var(--card-black);
    margin:0 0 8px;
    line-height:1.25;
  }
  .pc-type-label{
    position:relative;
    font-family:"Karla", sans-serif;
    font-weight:700;
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#6b6558;
  }

  /* ---- below-card: keys + draw again ---- */
  .below-card{ margin-top:20px; }

  .tags{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px; }
  .tag{
    font-family:"Karla", sans-serif;
    font-weight:600;
    font-size:12px;
    color: var(--ink);
    background: var(--card-bg);
    border:1px solid rgba(244,236,216,.18);
    padding:4px 10px;
    border-radius:8px;
  }

  .keys{ display:flex; flex-direction:column; gap:8px; }
  .key-toggle{
    align-self:flex-start;
    font-family:"Karla", sans-serif;
    font-weight:700;
    font-size:12.5px;
    color:#0d2a3d;
    background: linear-gradient(160deg, #9ccdf2, var(--sapphire));
    border:none;
    border-radius:9px;
    padding:9px 15px;
    cursor:pointer;
    box-shadow: 0 6px 16px rgba(63,143,214,.3);
  }
  .key-toggle.open{ background: linear-gradient(160deg, #cfe6fb, #7fb8e8); }
  .key-content{ margin: 8px 0 4px; }
  .key-content[hidden]{ display:none; }
  .query-console{
    display:flex; gap:10px; align-items:flex-start;
    background: var(--query-bg);
    border:1px solid rgba(111,176,242,.4);
    border-radius:12px;
    padding:12px;
  }
  .query-text{
    flex:1; margin:0;
    font-family:"Karla", sans-serif;
    font-weight:500;
    font-size:13.5px;
    line-height:1.55;
    color: var(--ink);
  }
  .copy-btn{
    flex:none;
    font-family:"Karla", sans-serif;
    font-weight:700;
    font-size:11px;
    letter-spacing:.02em;
    text-transform:uppercase;
    color:#0d2a3d;
    background: var(--sapphire);
    border:none;
    border-radius:8px;
    padding:8px 12px;
    cursor:pointer;
    box-shadow: 0 4px 12px rgba(63,143,214,.35);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .copy-btn:active{ transform: translateY(2px); box-shadow: 0 2px 6px rgba(63,143,214,.3); }
  .copy-btn.copied{ background: var(--exist); color:#0a2a1c; }
  .copy-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  @media (max-width:480px){
    .query-console{ flex-direction:column; }
    .copy-btn{ align-self:flex-end; }
  }

  .again-btn{
    display:table;
    margin:22px auto 0;
    font-family:"Cinzel", serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:.04em;
    color:#2a2007;
    background: linear-gradient(160deg, var(--gold-1), var(--gold-2));
    border:none;
    border-radius:999px;
    padding:14px 30px;
    cursor:pointer;
    box-shadow: 0 10px 26px rgba(202,162,58,.4);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .again-btn:active{ transform: translateY(2px); box-shadow: 0 5px 14px rgba(202,162,58,.35); }
  .again-btn:focus-visible{ outline:2px solid var(--sapphire); outline-offset:3px; }

  @media (prefers-reduced-motion: reduce){
    .playing-card{ animation:none; opacity:1; transform:none; }
    .card-row{ animation:none; }
  }
</style>
</head>
<body>

  </div>

  <p class="subtitle" id="topInfo"></p>

  <div class="stage" id="stage"></div>
  <div class="below-card" id="belowCard"></div>
</div>

const RANK_FOR_DIFF = { "Oson": "7", "O'rta": "J", "Qiyin": "A" };
const SUIT_PATH = {
  diamond: "M12 2 L22 12 L12 22 L2 12 Z",
  spade: "M12 3C8 8 3 12.2 3 16.2 3 19.4 5.6 22 8.8 22c1.6 0 3-.6 4-1.7-.4 2-1.7 3.6-3.6 4.7h5.6c-1.9-1.1-3.2-2.7-3.6-4.7 1 1.1 2.4 1.7 4 1.7 3.2 0 5.8-2.6 5.8-5.8 0-4-5-8.2-9-13.2Z",
};
const SUIT_FOR_TYPE = {
  exist: { shape: "diamond", color: "red" },
  idea: { shape: "spade", color: "black" },
};
function suitSvg(shape, size){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor"><path d="${SUIT_PATH[shape]}"/></svg>`;
}
const CARD_BACK_EMBLEM = `<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="${SUIT_PATH.diamond}"/></svg>`;

const stage = document.getElementById("stage");
const topInfoEl = document.getElementById("topInfo");
const belowCardEl = document.getElementById("belowCard");
const globalField = document.getElementById("globalField");

function aiQueryFor(p){
  if(p.type === "exist"){
    return `"${p.name}" xizmati qanday ishlaydi? Uning texnik arxitekturasini, ma'lumotlar bazasi tuzilishini, asosiy algoritmlarini va monetizatsiya modelini batafsil, misollar bilan tushuntirib ber.`;
  }
  return `Men "${p.name}" nomli loyiha g'oyasini amalga oshirmoqchiman: ${p.desc} Buning uchun MVP qanday funksiyalardan iborat bo'lishi kerak, qaysi texnologik stekni tanlash maqsadga muvofiq va bosqichma-bosqich boshlash rejasini tuzib ber.`;
}

function googleQueryFor(p){
  if(p.type === "exist"){
    return `${p.name} how it works technical architecture tech stack`;
  }
  return `${p.name} - mavjud yechimlar va raqobatchilar tahlili`;
}

/* ---- idle state: 4 rows of face-down cards scrolling across the page ---- */
const ROW_CONFIG = [
  { dir: "right", top: 15, dur: 24 },
  { dir: "left", top: 33, dur: 21 },
  { dir: "right", top: 51, dur: 27 },
  { dir: "left", top: 69, dur: 22 },
];
const CARD_PITCH = 92; // 70px card + 22px gap

function renderIdleField(){
  stage.innerHTML = "";
  belowCardEl.innerHTML = "";

  // enough cards in one set to always exceed the viewport width, so the
  // loop never shows a gap between where one pass ends and the next begins
  const setCount = Math.max(10, Math.ceil((window.innerWidth + CARD_PITCH * 3) / CARD_PITCH));

  globalField.innerHTML = ROW_CONFIG.map(row => {
    const cards = Array.from({ length: setCount }, () => `<div class="face-card">${CARD_BACK_EMBLEM}</div>`).join("");
    return `<div class="card-row dir-${row.dir}" style="top:${row.top}%;animation-duration:${row.dur}s">${cards}${cards}</div>`;
  }).join("");

  globalField.querySelectorAll(".face-card").forEach(el => {
    el.addEventListener("click", () => {
      const pick = PROJECTS[Math.floor(Math.random() * PROJECTS.length)];
      pickFromField(pick, el);
    }, { once: true });
  });
}

function pickFromField(pick, clickedEl){
  globalField.querySelectorAll(".card-row").forEach(row => {
    row.style.animationPlayState = "paused";
  });
  globalField.querySelectorAll(".face-card").forEach(el => {
    if(el !== clickedEl){
      el.style.transition = "opacity .3s ease";
      el.style.opacity = "0";
      el.style.pointerEvents = "none";
    }
  });
  clickedEl.style.pointerEvents = "none";
  clickedEl.style.transition = "opacity .25s ease, transform .25s ease";
  clickedEl.style.opacity = "0";
  clickedEl.style.transform = "scale(.7)";
  setTimeout(() => {
    globalField.innerHTML = "";
    landOnCard(pick);
  }, 220);
}

/* ---- picked state: minimal foil card + info split above/below it ---- */
function renderPicked(pick){
  const isExist = pick.type === "exist";
  const typeVar = isExist ? "exist" : "idea";
  const bigLabel = isExist ? "MAVJUD LOYIHA" : "YANGI G'OYA";
  const rank = RANK_FOR_DIFF[pick.difficulty] || "7";
  const suit = SUIT_FOR_TYPE[pick.type] || SUIT_FOR_TYPE.exist;

  topInfoEl.innerHTML =
    `<span class="picked-banner" style="color:var(--${typeVar})">${bigLabel} · Qiyinlik: ${pick.difficulty}</span>` +
    `<span class="picked-desc">${pick.desc}</span>`;

  stage.innerHTML = `
    <div class="playing-card" data-suit="${suit.color}">
      <div class="pc-corner pc-top">
        <span class="pc-rank">${rank}</span>
        ${suitSvg(suit.shape, 15)}
      </div>
      <div class="pc-center">
        <span class="pc-watermark">${suitSvg(suit.shape, 108)}</span>
        <h2 class="pc-name">${pick.name}</h2>
        <span class="pc-type-label">${bigLabel}</span>
      </div>
      <div class="pc-corner pc-bottom">
        <span class="pc-rank">${rank}</span>
        ${suitSvg(suit.shape, 15)}
      </div>
    </div>
  `;

  const aiQuery = aiQueryFor(pick);
  const googleQuery = googleQueryFor(pick);

  belowCardEl.innerHTML = `
    <div class="tags">${pick.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
    <div class="keys">
      <button class="key-toggle" type="button" data-target="keyAi">Kalit: AI'ga savol ber ›</button>
      <div class="key-content" id="keyAi" hidden>
        <div class="query-console">
          <p class="query-text">${aiQuery}</p>
          <button class="copy-btn" type="button">NUSXALASH</button>
        </div>
      </div>
      <button class="key-toggle" type="button" data-target="keyGoogle">Kalit: Google'da qidir ›</button>
      <div class="key-content" id="keyGoogle" hidden>
        <div class="query-console">
          <p class="query-text">${googleQuery}</p>
          <button class="copy-btn" type="button">NUSXALASH</button>
        </div>
      </div>
    </div>
    <button class="again-btn" type="button" id="againBtn">Yana karta tort</button>
  `;
  document.getElementById("againBtn").addEventListener("click", () => {
    topInfoEl.innerHTML = "";
    belowCardEl.innerHTML = "";
    renderIdleField();
  });
}

function landOnCard(pick){
  renderPicked(pick);
}

function copyText(text, btn){
  const original = btn.textContent;
  const finish = (ok) => {
    btn.textContent = ok ? "OLINDI!" : "XATOLIK";
    btn.classList.toggle("copied", ok);
    setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove("copied");
    }, 1600);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => finish(true)).catch(() => fallbackCopy(text, finish));
  } else {
    fallbackCopy(text, finish);
  }
}

function fallbackCopy(text, finish){
  try{
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    finish(ok);
  }catch(err){
    finish(false);
  }
}

document.addEventListener("click", (e) => {
  const toggle = e.target.closest(".key-toggle");
  if(toggle){
    const content = document.getElementById(toggle.dataset.target);
    if(content){
      const isHidden = content.hasAttribute("hidden");
      if(isHidden){ content.removeAttribute("hidden"); toggle.classList.add("open"); }
      else { content.setAttribute("hidden", ""); toggle.classList.remove("open"); }
    }
    return;
  }
  const copyBtn = e.target.closest(".copy-btn");
  if(copyBtn){
    const row = copyBtn.closest(".query-console");
    const textEl = row && row.querySelector(".query-text");
    if(textEl) copyText(textEl.textContent, copyBtn);
  }
});

renderIdleField();
</script>
