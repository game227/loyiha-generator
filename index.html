<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loyiha Generatori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6E8C8;
    --paper-2:#EFDCB0;
    --card-bg:#FFFBF0;
    --ink:#241C14;
    --ink-soft:#6b5d47;
    --red:#E8432E;
    --blue:#2C5FC4;
    --yellow:#F2A93B;
    --exist:#3E8E4F;
    --exist-bg:#DCEEDF;
    --idea:#7B4FC7;
    --idea-bg:#EAE0F7;
    --query:#2C5FC4;
    --query-bg:#DCE6F7;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    padding-block:32px;
    padding-inline:16px;
    background-color: var(--paper);
    background-image: radial-gradient(rgba(36,28,20,.09) 1.2px, transparent 1.2px);
    background-size: 14px 14px;
    color: var(--ink);
    font-family: "Nunito Sans", ui-sans-serif, system-ui, sans-serif;
  }

  .box{
    max-width: 680px;
    margin: 0 auto;
    background: var(--card-bg);
    border: 4px solid var(--ink);
    border-radius: 22px;
    padding: 22px;
    box-shadow: 8px 8px 0 var(--ink);
  }

  .box-header{
    text-align:center;
    padding-bottom:18px;
    margin-bottom:20px;
    border-bottom: 3px dashed var(--ink);
  }
  .badge-seal{
    display:inline-flex; align-items:center; justify-content:center;
    width:58px; height:58px;
    border-radius:50%;
    background: var(--yellow);
    border:3px solid var(--ink);
    font-family:"Baloo 2", sans-serif;
    font-weight:800;
    font-size:22px;
    margin-bottom:10px;
    transform: rotate(-6deg);
    box-shadow: 3px 3px 0 var(--ink);
  }
  .title{
    font-family:"Baloo 2", sans-serif;
    font-weight:800;
    font-size: clamp(26px, 6vw, 38px);
    color: var(--red);
    text-shadow: -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink);
    margin:0 0 8px;
    text-wrap:balance;
  }
  .tagline{
    font-family:"Baloo 2", sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:.03em;
    color: var(--ink-soft);
    text-transform:uppercase;
    margin:0;
  }

  .sec-label{
    font-family:"Baloo 2", sans-serif;
    font-weight:700;
    font-size:11px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color: var(--ink-soft);
    margin: 0 0 8px;
  }
  .deck-label{ text-align:center; margin-bottom:10px; }

  /* ---- deck preview marquee ---- */
  .marquee-wrap{
    margin: 0 0 22px;
    display:flex;
    flex-direction:column;
    gap:8px;
    overflow:hidden;
    -webkit-mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
    mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
  }
  .marquee-row{
    display:flex;
    width:max-content;
    gap:8px;
    animation: scrollLeft 40s linear infinite;
  }
  .marquee-row.dir-right{ animation-name: scrollRight; }
  .marquee-row.dir-left{ animation-name: scrollLeft; }
  @keyframes scrollLeft{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  @keyframes scrollRight{ from{ transform:translateX(-50%); } to{ transform:translateX(0); } }
  .chip{
    flex:none;
    display:flex; align-items:center; gap:6px;
    font-family:"Baloo 2", sans-serif;
    font-weight:700;
    font-size:12.5px;
    color: var(--ink);
    background: var(--card-bg);
    border:2px solid var(--ink);
    border-radius:10px;
    padding:6px 12px;
    box-shadow: 2px 2px 0 var(--ink);
    white-space:nowrap;
  }
  .chip .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .chip.exist .dot{ background: var(--exist); }
  .chip.idea .dot{ background: var(--idea); }

  /* ---- top info: instructions / picked summary ---- */
  .subtitle{
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1.6;
    max-width: 56ch;
    margin: 0 0 18px;
  }
  .subtitle .picked-banner{
    display:block;
    font-family:"Baloo 2", sans-serif;
    font-weight:800;
    font-size:13px;
    letter-spacing:.04em;
    margin-bottom:8px;
  }
  .subtitle .picked-desc{ display:block; color:var(--ink-soft); font-size:14.5px; line-height:1.6; }

  /* ---- face-down card field ---- */
  .stage{ position:relative; min-height: 340px; }
  .field-tray{
    position:absolute; inset:0;
    border:3px dashed var(--ink);
    border-radius:14px;
    background: var(--paper-2);
    overflow:hidden;
  }
  .face-card{
    position:absolute;
    width:74px; height:100px;
    margin-left:-37px; margin-top:-50px;
    border-radius:10px;
    background: var(--red);
    border:3px solid var(--ink);
    box-shadow:3px 3px 0 var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-family:"Baloo 2", sans-serif;
    font-weight:800;
    font-size:24px;
    color:#fff;
    cursor:pointer;
    user-select:none;
  }
  .face-card:nth-child(4n+2){ background: var(--blue); }
  .face-card:nth-child(4n+3){ background: var(--idea); }
  .face-card:nth-child(4n){ background: var(--yellow); color: var(--ink); }
  @keyframes drift1{ 0%,100%{ transform:translate(0,0) rotate(0deg); } 50%{ transform:translate(14px,-10px) rotate(4deg); } }
  @keyframes drift2{ 0%,100%{ transform:translate(0,0) rotate(0deg); } 50%{ transform:translate(-12px,12px) rotate(-5deg); } }
  @keyframes drift3{ 0%,100%{ transform:translate(0,0) rotate(0deg); } 50%{ transform:translate(10px,10px) rotate(3deg); } }

  /* ---- drawn card (name + timer only) ---- */
  .card{
    position:relative;
    background: var(--card-bg);
    border: 3px solid var(--ink);
    border-radius:16px;
    box-shadow: 6px 6px 0 var(--ink);
    overflow:hidden;
    opacity:0;
    transform: translateY(10px) scale(.97) rotate(-1deg);
    animation: cardIn .3s ease forwards;
  }
  @keyframes cardIn{ to{ opacity:1; transform:none; } }
  .card-banner{
    padding:10px;
    background: var(--type-color);
    border-bottom:3px solid var(--ink);
  }
  .card-body{ padding: 26px 20px 28px; text-align:center; }
  .card h2{
    font-family:"Baloo 2", sans-serif;
    font-weight:800;
    font-size:26px;
    color: var(--ink);
    margin:0;
    text-wrap:balance;
  }
  /* ---- below-card: keys + draw again ---- */
  .below-card{ margin-top:18px; }
  .again-btn{
    display:table;
    margin:20px auto 0;
    font-family:"Baloo 2", sans-serif;
    font-weight:800;
    font-size:15px;
    color:#fff;
    background: var(--red);
    border:3px solid var(--ink);
    border-radius:999px;
    padding:14px 28px;
    cursor:pointer;
    box-shadow:5px 5px 0 var(--ink);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .again-btn:active{ transform: translate(4px,4px); box-shadow:1px 1px 0 var(--ink); }
  .again-btn:focus-visible{ outline:3px solid var(--blue); outline-offset:3px; }

  .tags{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px; }
  .tag{
    font-family:"Nunito Sans", sans-serif;
    font-weight:700;
    font-size:12px;
    color: var(--ink);
    background: var(--paper-2);
    border:2px solid var(--ink);
    padding:4px 10px;
    border-radius:8px;
  }

  .keys{ display:flex; flex-direction:column; gap:8px; }
  .key-toggle{
    align-self:flex-start;
    font-family:"Baloo 2", sans-serif;
    font-weight:700;
    font-size:12.5px;
    color: var(--ink);
    background: var(--yellow);
    border:2px solid var(--ink);
    border-radius:8px;
    padding:8px 14px;
    cursor:pointer;
    box-shadow:2px 2px 0 var(--ink);
  }
  .key-toggle.open{ background: var(--blue); color:#fff; }
  .key-content{ margin: 8px 0 4px; }
  .key-content[hidden]{ display:none; }
  .query-console{
    display:flex; gap:10px; align-items:flex-start;
    background: var(--query-bg);
    border:2px dashed var(--query);
    border-radius:12px;
    padding:12px;
  }
  .query-text{
    flex:1; margin:0;
    font-family:"Nunito Sans", sans-serif;
    font-weight:600;
    font-size:13.5px;
    line-height:1.55;
    color: var(--ink);
  }
  .copy-btn{
    flex:none;
    font-family:"Baloo 2", sans-serif;
    font-weight:700;
    font-size:11px;
    letter-spacing:.02em;
    text-transform:uppercase;
    color:#fff;
    background: var(--blue);
    border:2px solid var(--ink);
    border-radius:8px;
    padding:8px 12px;
    cursor:pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .copy-btn:active{ transform: translate(3px,3px); box-shadow: 0 0 0 var(--ink); }
  .copy-btn.copied{ background: var(--exist); }
  .copy-btn:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  @media (max-width:480px){
    .query-console{ flex-direction:column; }
    .copy-btn{ align-self:flex-end; }
  }

  .counter-badge{
    display:table;
    margin: 22px auto 0;
    font-family:"Baloo 2", sans-serif;
    font-weight:700;
    font-size:14px;
    color: var(--ink);
    background: var(--yellow);
    border:2.5px solid var(--ink);
    padding:6px 16px;
    border-radius:999px;
    box-shadow: 3px 3px 0 var(--ink);
  }

  .footer-plate{
    text-align:center;
    font-size:12px;
    color: var(--ink-soft);
    margin-top:16px;
    padding:0 10px;
  }

  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; opacity:1; transform:none; }
    .marquee-row{ animation:none; }
    .face-card{ animation:none !important; }
  }

  /* ---- onboarding overlay ---- */
  .onboard-overlay{
    position:fixed; inset:0;
    background: rgba(36,28,20,.6);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    z-index:1000;
  }
  .onboard-overlay.hidden{ display:none; }
  .onboard-modal{
    background: var(--card-bg);
    border:4px solid var(--ink);
    border-radius:18px;
    padding:26px 24px;
    max-width:440px;
    width:100%;
    max-height:85vh;
    overflow-y:auto;
    box-shadow:8px 8px 0 var(--ink);
  }
  .onboard-title{
    font-family:"Baloo 2", sans-serif;
    font-weight:800;
    font-size:22px;
    color: var(--red);
    text-shadow: -1.5px -1.5px 0 var(--ink), 1.5px -1.5px 0 var(--ink), -1.5px 1.5px 0 var(--ink), 1.5px 1.5px 0 var(--ink);
    margin:0 0 12px;
  }
  .onboard-text{ font-size:14.5px; line-height:1.6; color: var(--ink-soft); margin:0 0 20px; }
  .onboard-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .onboard-btn{
    font-family:"Baloo 2", sans-serif;
    font-weight:700;
    font-size:14px;
    padding:10px 20px;
    border:2.5px solid var(--ink);
    border-radius:10px;
    cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .onboard-btn:active{ transform: translate(3px,3px); box-shadow:0 0 0 var(--ink); }
  .onboard-btn:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
  .onboard-btn.primary{ background: var(--exist); color:#fff; }
  .onboard-btn.secondary{ background: var(--paper-2); color: var(--ink); }
  .onboard-steps{ margin:0 0 18px; padding-left:20px; font-size:14px; line-height:1.7; color: var(--ink-soft); }
  .onboard-steps li{ margin-bottom:6px; }
  .onboard-try-label{
    font-family:"Baloo 2", sans-serif;
    font-weight:700;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color: var(--ink-soft);
    margin:0 0 10px;
  }
  .onboard-demo{ text-align:center; margin-bottom:20px; }
  .demo-face{ position:static !important; margin:0 auto 12px !important; animation:none !important; }
  .demo-result{ font-size:13.5px; line-height:1.6; color: var(--ink); }
  .demo-note{ display:block; font-size:12px; color: var(--ink-soft); margin-top:4px; }
</style>
</head>
<body>
<div class="box">

  <div class="box-header">
    <div class="badge-seal">?</div>
    <h1 class="title">LOYIHA O'YINI</h1>
    <p class="tagline">Tasodifiy IT loyiha kartalari to'plami</p>
  </div>

  <div class="deck-label sec-label">To'plamdagi kartalar</div>
  <div class="marquee-wrap" id="marqueeWrap"></div>

  <p class="subtitle" id="topInfo">Istalgan kartani tanlang — u orqali o'zingiz uchun yangi loyihani kashf etasiz!</p>

  <div class="stage" id="stage"></div>
  <div class="below-card" id="belowCard"></div>

  <div class="counter-badge" id="counter">TORTILGAN 000</div>
  <div class="footer-plate">Har safar kartani ochganingizda yangi loyiha chiqadi — istagan vaqtingizda yana tortishingiz mumkin.</div>
</div>

<div class="onboard-overlay" id="onboardOverlay">
  <div class="onboard-modal" id="onboardModal"></div>
</div>

<script>
const PROJECTS = [
  // ---- MAVJUD (dunyoda haqiqatan mavjud IT loyihalar) ----

  {name:"Uber", type:"exist", difficulty:"Qiyin", desc:"Real-vaqt xarita va marshrutlash asosida haydovchi va yo'lovchini bog'laydigan taksi chaqirish platformasi.", tags:["Geolocation","Payments","Realtime"]},
  {name:"Airbnb", type:"exist", difficulty:"Qiyin", desc:"Uy egalari va sayohatchilarni bog'lovchi qisqa muddatli ijara bozori.", tags:["Marketplace","Booking","Payments"]},

  {name:"Duolingo", type:"exist", difficulty:"O'rta", desc:"Til o'rganishni o'yinga aylantirgan (gamification) mobil ta'lim ilovasi.", tags:["EdTech","Gamification","Mobile"]},
  {name:"Wikipedia", type:"exist", difficulty:"O'rta", desc:"Har kim tahrirlashi mumkin bo'lgan ochiq, bepul onlayn ensiklopediya.", tags:["Wiki","Open Source","CMS"]},

  {name:"Notion", type:"exist", difficulty:"Qiyin", desc:"Eslatmalar, hujjatlar va bazalarni bitta workspace ichida birlashtiruvchi mahsuldorlik ilovasi.", tags:["Productivity","Docs","Database"]},
  {name:"Figma", type:"exist", difficulty:"Qiyin", desc:"Brauzerda ishlaydigan, real-vaqtda hamkorlikda dizayn qilish vositasi.", tags:["Design","Realtime","Canvas"]},
  {name:"Telegram", type:"exist", difficulty:"Qiyin", desc:"Tezkor, shifrlangan xabar almashish ilovasi, botlar va kanallar bilan.", tags:["Messaging","Bots","Encryption"]},
  {name:"TikTok", type:"exist", difficulty:"Qiyin", desc:"Qisqa video kontent va kuchli tavsiya algoritmiga asoslangan platforma.", tags:["Video","Recommendation AI","Mobile"]},

  {name:"Slack", type:"exist", difficulty:"O'rta", desc:"Jamoalar uchun kanal asosida ishlaydigan ish xabarlashuv platformasi.", tags:["Messaging","Teams","Integrations"]},
  {name:"Trello", type:"exist", difficulty:"O'rta", desc:"Kanban doskalari asosida vazifalarni boshqarish vositasi.", tags:["Kanban","Task Management"]},
  {name:"Zoom", type:"exist", difficulty:"Qiyin", desc:"Video konferensiya va onlayn uchrashuvlar uchun platforma.", tags:["Video Call","WebRTC"]},

  {name:"LinkedIn", type:"exist", difficulty:"Qiyin", desc:"Professional tarmoq va ish qidirish platformasi.", tags:["Networking","Recruiting"]},
  {name:"WhatsApp", type:"exist", difficulty:"Qiyin", desc:"Oxir-oxirigacha shifrlangan xabar va qo'ng'iroq ilovasi.", tags:["Messaging","Encryption"]},
  {name:"Google Maps", type:"exist", difficulty:"Qiyin", desc:"Xarita, navigatsiya va joy izlash xizmati.", tags:["Maps","Navigation"]},
  {name:"YouTube", type:"exist", difficulty:"Qiyin", desc:"Video yuklash, tomosha qilish va monetizatsiya qilish platformasi.", tags:["Video","CDN","Ads"]},

  {name:"Dropbox", type:"exist", difficulty:"Qiyin", desc:"Fayllarni bulutda saqlash va turli qurilmalar orasida avtomatik sinxronlash xizmati.", tags:["Cloud Storage","Sync"]},

  {name:"Asana", type:"exist", difficulty:"O'rta", desc:"Jamoalar uchun vazifa va loyihalarni rejalashtirish hamda kuzatib borish platformasi.", tags:["Project Management","Teams"]},
  {name:"Airtable", type:"exist", difficulty:"O'rta", desc:"Jadval va bazani birlashtirgan, kod yozmasdan moslashtirish mumkin bo'lgan ma'lumot boshqaruv vositasi.", tags:["Database","No-code","Spreadsheet"]},
  {name:"Coursera", type:"exist", difficulty:"Qiyin", desc:"Dunyo universitetlaridan onlayn kurslar va sertifikatlar taqdim etuvchi ta'lim platformasi.", tags:["EdTech","Video","Certificates"]},
  {name:"Khan Academy", type:"exist", difficulty:"O'rta", desc:"Bepul video darslar va mashqlar orqali turli fanlarni o'rgatuvchi notijorat ta'lim platformasi.", tags:["EdTech","Nonprofit","Video"]},
  {name:"Booking.com", type:"exist", difficulty:"Qiyin", desc:"Mehmonxona va turar joylarni qidirish hamda onlayn bron qilish platformasi.", tags:["Travel","Booking"]},
  {name:"Skyscanner", type:"exist", difficulty:"Qiyin", desc:"Aviachiptalar narxini turli aviakompaniyalar bo'yicha solishtiruvchi qidiruv tizimi.", tags:["Travel","Aggregator"]},
  {name:"Waze", type:"exist", difficulty:"Qiyin", desc:"Haydovchilarning real vaqtdagi hisobotlari asosida ishlaydigan jamoaviy navigatsiya ilovasi.", tags:["Maps","Community","Realtime"]},
  {name:"Snapchat", type:"exist", difficulty:"Qiyin", desc:"Vaqtinchalik, o'zi yo'qoluvchi foto va video xabarlar almashish ilovasi.", tags:["Social","AR","Messaging"]},
  {name:"Tinder", type:"exist", difficulty:"O'rta", desc:"Joylashuv va qiziqishlar asosida ishlaydigan tanishuv ilovasi.", tags:["Dating","Geolocation"]},
  {name:"Strava", type:"exist", difficulty:"O'rta", desc:"Sportchilar uchun mashg'ulotlarni kuzatib boruvchi va ijtimoiy tarmoq bilan bog'lovchi ilova.", tags:["Fitness","Social","GPS"]},
  {name:"Headspace", type:"exist", difficulty:"Oson", desc:"Meditatsiya va ongli fikrlash amaliyotlarini o'rgatuvchi audio-ilova.", tags:["Wellness","Audio"]},
  {name:"Robinhood", type:"exist", difficulty:"Qiyin", desc:"Vositachisiz va komissiyasiz aksiya hamda kriptovalyuta sotib olish ilovasi.", tags:["Fintech","Trading"]},
  {name:"Venmo", type:"exist", difficulty:"O'rta", desc:"Do'stlar orasida pul o'tkazish va uni ijtimoiy oqimda ko'rsatuvchi to'lov ilovasi.", tags:["Fintech","Social Payments"]},

function buildDeckMarquee(){
  const wrap = document.getElementById("marqueeWrap");
  if(!wrap) return;
  const rows = [[], [], [], []];
  PROJECTS.forEach((p, i) => rows[i % 4].push(p));
  const directions = ["right", "left", "right", "left"];
  const speeds = [38, 44, 40, 46];

  wrap.innerHTML = rows.map((rowProjects, i) => {
    const chips = rowProjects.map(p =>
      `<span class="chip ${p.type}"><span class="dot"></span>${p.name}</span>`
    ).join("");
    return `<div class="marquee-row dir-${directions[i]}" style="animation-duration:${speeds[i]}s">${chips}${chips}</div>`;
  }).join("");
}

function aiQueryFor(p){
  if(p.type === "exist"){
    return `"${p.name}" xizmati qanday ishlaydi? Uning texnik arxitekturasini, ma'lumotlar bazasi tuzilishini, asosiy algoritmlarini va monetizatsiya modelini batafsil, misollar bilan tushuntirib ber.`;

}

function googleQueryFor(p){
  if(p.type === "exist"){
    return `${p.name} how it works technical architecture tech stack`;
  }
  return `${p.name} - mavjud yechimlar va raqobatchilar tahlili`;
}

function starsFor(level){
  let s = "";
  for(let i=1;i<=3;i++){ s += i <= level ? "★" : "☆"; }
  return s;
}

/* ---- idle state: a tray of face-down, gently drifting cards ---- */
function layoutPositions(n){
  const cols = Math.ceil(Math.sqrt(n * 1.6));
  const rows = Math.ceil(n / cols);
  const cellW = 100 / cols, cellH = 100 / rows;
  const pts = [];
  for(let i = 0; i < n; i++){
    const col = i % cols, row = Math.floor(i / cols);
    const jitterX = (Math.random() - 0.5) * cellW * 0.5;
    const jitterY = (Math.random() - 0.5) * cellH * 0.5;
    const left = Math.min(93, Math.max(7, col * cellW + cellW / 2 + jitterX));
    const top = Math.min(86, Math.max(14, row * cellH + cellH / 2 + jitterY));
    pts.push({ left, top });
  }
  return pts;
}

function renderIdleField(){
  const N = 10;
  const positions = layoutPositions(N);
  const cards = positions.map((pos, i) => {
    const driftN = (i % 3) + 1;
    const dur = (7 + Math.random() * 4).toFixed(1);
    const delay = (Math.random() * 3).toFixed(1);
    return `<div class="face-card" style="left:${pos.left}%;top:${pos.top}%;animation-name:drift${driftN};animation-duration:${dur}s;animation-delay:${delay}s;">?</div>`;
  }).join("");
  stage.innerHTML = `<div class="field-tray">${cards}</div>`;
  belowCardEl.innerHTML = "";

  stage.querySelectorAll(".face-card").forEach(el => {
    el.addEventListener("click", () => {
      const pick = PROJECTS[Math.floor(Math.random() * PROJECTS.length)];
      pickFromField(pick, el);
    }, { once: true });
  });
}

function pickFromField(pick, clickedEl){
  stage.querySelectorAll(".face-card").forEach(el => {
    if(el !== clickedEl){
      el.style.transition = "opacity .3s ease";
      el.style.opacity = "0";
      el.style.pointerEvents = "none";
    }
  });
  clickedEl.style.pointerEvents = "none";
  clickedEl.style.animation = "none";

  const flickerNames = Array.from({ length: 4 }, () =>
    PROJECTS[Math.floor(Math.random() * PROJECTS.length)].name.slice(0, 9)
  );
  let flickers = 0;
  const flickerInterval = setInterval(() => {
    clickedEl.textContent = flickerNames[flickers % flickerNames.length];
    flickers++;
    if(flickers >= 4){
      clearInterval(flickerInterval);
      clickedEl.style.transition = "opacity .25s ease, transform .25s ease";
      clickedEl.style.opacity = "0";
      clickedEl.style.transform = "scale(.7)";
      setTimeout(() => landOnCard(pick), 220);
    }
  }, 90);
}

function landOnCard(pick){

function copyText(text, btn){
  const original = btn.textContent;
  const finish = (ok) => {
    btn.textContent = ok ? "OLINDI!" : "XATOLIK";
    btn.classList.toggle("copied", ok);
    setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove("copied");
    }, 1600);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => finish(true)).catch(() => fallbackCopy(text, finish));
  } else {
    fallbackCopy(text, finish);
  }
}

function fallbackCopy(text, finish){
  try{
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    finish(ok);
  }catch(err){
    finish(false);
  }
}

document.addEventListener("click", (e) => {
  const toggle = e.target.closest(".key-toggle");
  if(toggle){
    const content = document.getElementById(toggle.dataset.target);
    if(content){
      const isHidden = content.hasAttribute("hidden");
      if(isHidden){ content.removeAttribute("hidden"); toggle.classList.add("open"); }
      else { content.setAttribute("hidden", ""); toggle.classList.remove("open"); }
    }
    return;
  }
  const copyBtn = e.target.closest(".copy-btn");
  if(copyBtn){
    const row = copyBtn.closest(".query-console");
    const textEl = row && row.querySelector(".query-text");
    if(textEl) copyText(textEl.textContent, copyBtn);
  }
});

    <div class="onboard-actions">
      <button class="onboard-btn primary" id="understandBtn" type="button">Tushundim</button>
      <button class="onboard-btn secondary" id="dontUnderstandBtn" type="button">Tushunmadim</button>
    </div>
  `;
  document.getElementById("understandBtn").addEventListener("click", closeOnboard);
  document.getElementById("dontUnderstandBtn").addEventListener("click", renderOnboardStep2);
}

function renderOnboardStep2(){
  onboardModal.innerHTML = `
    <h2 class="onboard-title">Qanday ishlatiladi?</h2>
    <ol class="onboard-steps">
      <li>Yopiq kartalardan birini tanlang.</li>
      <li>Karta ochiladi — loyiha nomi ko'rinadi.</li>
      <li>Pastda tavsif, kerakli texnologiyalar va "Kalitlar" (AI/Google so'rovlari) chiqadi — ularni bosib to'liq ma'lumot oling.</li>
      <li>"Yana karta tort" tugmasi bilan istalgan vaqtda yangi loyiha tanlaysiz.</li>
    </ol>
    <p class="onboard-try-label">Hoziroq sinab ko'ring</p>
    <div class="onboard-demo">
      <div class="face-card demo-face" id="demoFaceCard">?</div>
      <p class="demo-result" id="demoResult" hidden></p>
    </div>
    <div class="onboard-actions">
      <button class="onboard-btn primary" id="toSiteBtn" type="button">Saytga o'tish</button>
    </div>
  `;
  document.getElementById("toSiteBtn").addEventListener("click", closeOnboard);

  const demoCard = document.getElementById("demoFaceCard");
  const demoResult = document.getElementById("demoResult");
  demoCard.addEventListener("click", () => {
    const pick = PROJECTS[Math.floor(Math.random() * PROJECTS.length)];
    const label = pick.type === "exist" ? "MAVJUD KARTA" : "YANGI KARTA";
    const diffN = DIFF_LEVEL[pick.difficulty] || 1;
    demoCard.style.opacity = ".35";
    demoCard.style.pointerEvents = "none";
    demoCard.textContent = "✓";
    demoResult.hidden = false;
    demoResult.innerHTML =
      `<strong>${pick.name}</strong> — ${label} · ${starsFor(diffN)} ${pick.difficulty.toUpperCase()}` +
      `<span class="demo-note">Bu — sinov, hisobga olinmaydi. Haqiqiy saytda xuddi shunday karta chiqadi.</span>`;
  }, { once: true });
}

renderOnboardStep1();
</script>
</body>
</html>
